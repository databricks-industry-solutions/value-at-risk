name: Value at Risk - Databricks CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install databricks-cli
          pip install -r requirements.txt

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Configure Databricks CLI authentication
        run: |
          echo "[DEFAULT]" > ~/.databrickscfg
          echo "host = ${{ secrets.DATABRICKS_HOST }}" >> ~/.databrickscfg
          echo "token = ${{ secrets.DATABRICKS_TOKEN }}" >> ~/.databrickscfg

      - name: Get or Create serverless SQL warehouse
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          WAREHOUSE_NAME="Shared Unity Catalog Serverless"
          echo "Looking for warehouse named: $WAREHOUSE_NAME"
          
          # Try to find existing warehouse
          EXISTING_WAREHOUSE=$(curl -s -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$DATABRICKS_HOST/api/2.0/sql/warehouses")
          
          WAREHOUSE_ID=$(echo "$EXISTING_WAREHOUSE" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              if 'warehouses' in data:
                  warehouses = data['warehouses']
                  matching = [w for w in warehouses if w['name'] == '$WAREHOUSE_NAME']
                  if matching:
                      print(matching[0]['id'])
                  else:
                      print('')
              else:
                  print('')
          except:
              print('')
          ")
          
          if [ -z "$WAREHOUSE_ID" ]; then
            echo "Creating new serverless warehouse..."
            RESPONSE=$(curl -s -X POST -H "Authorization: Bearer $DATABRICKS_TOKEN" \
              -H "Content-Type: application/json" \
              "$DATABRICKS_HOST/api/2.0/sql/warehouses" \
              -d "{
                \"name\": \"$WAREHOUSE_NAME\",
                \"cluster_size\": \"2X-Small\",
                \"enable_serverless_compute\": true,
                \"auto_stop_mins\": 10,
                \"max_num_clusters\": 1
              }")
            
            WAREHOUSE_ID=$(echo $RESPONSE | python3 -c "import sys, json; print(json.load(sys.stdin).get('id', ''))")
          fi
          
          echo "WAREHOUSE_ID=$WAREHOUSE_ID" >> $GITHUB_ENV
          echo "DEPLOY_ENV=dev" >> $GITHUB_ENV

      - name: Run Python tests
        run: |
          if [ -d "tests" ]; then
            python -m pytest tests/ -v
          else
            echo "No tests directory found, skipping tests"
          fi

      - name: Validate DAB bundle
        run: databricks bundle validate --var="environment=${{ env.DEPLOY_ENV }}"

      - name: Deploy bundle (dev environment)
        if: github.ref == 'refs/heads/main'
        run: |
          databricks bundle deploy --target dev --var="environment=${{ env.DEPLOY_ENV }}"

      - name: Run Value at Risk workflow
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Starting Value at Risk workflow execution..."
          databricks bundle run value_at_risk_workflow --target dev --var="environment=${{ env.DEPLOY_ENV }}"
          echo "Workflow execution completed"

      - name: Cleanup PR deployment
        if: github.event_name == 'pull_request'
        run: |
          databricks bundle destroy --target dev --var="environment=${{ env.DEPLOY_ENV }}" || true