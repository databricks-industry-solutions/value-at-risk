# Value at Risk - Modern Configuration
# This configuration uses Unity Catalog and modern Databricks patterns

# Market data configuration
market_data:
  # Financial data source configuration
  yfinance:
    # Historical data range for model training and backtesting
    mindate: '2018-05-01'
    maxdate: '2020-05-01'
    # Enable real-time data updates
    realtime: false
    # Data refresh interval (hours)
    refresh_interval: 24

# Unity Catalog configuration
unity_catalog:
  # These will be overridden by DAB bundle parameters
  catalog_name: '${catalog_name}'
  schema_name: '${schema_name}'
  # Modern table naming convention
  tables:
    market_data: 'market_data'
    market_indicators: 'market_indicators'
    market_volatility: 'market_volatility'
    monte_carlo_market: 'monte_carlo_market'
    monte_carlo_trials: 'monte_carlo_trials'
    risk_metrics: 'risk_metrics'
    compliance_reports: 'compliance_reports'

# MLflow 2.8+ configuration
mlflow:
  # Model registry configuration
  model:
    name: 'value_at_risk'
    # Training date configuration
    training_date: '2019-09-01'
    # Model versioning
    version_stage: 'Development'
    # Tags for model governance
    tags:
      use_case: 'financial_risk_management'
      framework: 'monte_carlo_simulation'
      industry: 'financial_services'
  
  # Experiment configuration
  experiment:
    name: 'var_model_experiments'
    # Artifact storage location
    artifact_location: 'unity_catalog'

# Monte Carlo simulation configuration
monte_carlo:
  # Compute configuration
  compute:
    # Use serverless compute for cost efficiency
    serverless: true
    # Fallback cluster configuration
    cluster_size: 'Medium'
    # Auto-scaling configuration
    min_workers: 2
    max_workers: 20
  
  # Simulation parameters
  simulation:
    # Historical volatility window (days)
    volatility_window: 90
    # Number of simulation runs per instrument
    runs: 32000
    # Confidence levels for VaR calculation
    confidence_levels: [0.95, 0.99]
    # Time horizon for risk calculation (days)
    time_horizon: 1

# Risk management configuration
risk_management:
  # Portfolio configuration
  portfolio:
    # Portfolio file location
    config_file: 'config/portfolio.json'
    # Rebalancing frequency
    rebalance_frequency: 'monthly'
  
  # Compliance configuration
  compliance:
    # Basel Committee standards
    basel_compliance: true
    # Backtesting configuration
    backtesting:
      # Backtesting window (days)
      window: 250
      # Exceedance thresholds
      thresholds:
        green: 4
        yellow: 9
        red: 10

# Environment-specific overrides
environments:
  dev:
    monte_carlo:
      simulation:
        runs: 1000  # Reduced for faster development
  
  staging:
    monte_carlo:
      simulation:
        runs: 16000  # Balanced for testing
  
  prod:
    monte_carlo:
      simulation:
        runs: 32000  # Full production runs
